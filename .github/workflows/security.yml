name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          post-processed-sarif-path: codeql-processed-sarif
          upload: never
      - name: Explain skipped GitHub Code Scanning upload
        if: always()
        run: |
          {
            echo "## GitHub Code Scanning upload: skipped"
            echo
            echo "CodeQL analysis runs locally in this workflow. Uploading SARIF to the GitHub Security tab is not available for this repository, so no Code Scanning upload was attempted. The SARIF artifact is retained below when produced. High/critical findings fail this job."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: |
            codeql-results/
            codeql-processed-sarif/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on high/critical CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(codeql-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CodeQL SARIF produced; failing closed."
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            count=$(jq '[.runs[] as $r
              | $r.results[]? as $res
              | ([$r.tool.driver.rules[]?, ($r.tool.extensions[]?.rules[]?)]
                  | map(select(.id == $res.ruleId)) | first
                  | (.properties["security-severity"] // "0") | tonumber)
              | select(. >= 7.0)] | length' "$f")
            echo "$f: $count high/critical finding(s)"
            total=$((total + count))
          done
          echo "### CodeQL high/critical findings: $total" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text) @ \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "${files[@]}" | head -50
            exit 1
          fi

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
      - name: Run Gosec Security Scanner
        uses: securego/gosec@244f1f6f4d1d0d14f89e79a73dab1219eabb5228 # pin of master @ 2026-11-20
        with:
          # 只有 high 严重度（且至少 medium 置信度）的问题会让作业失败
          args: '-severity high -confidence medium -fmt sarif -out gosec-results.sarif ./...'
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Gosec SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. High-severity findings fail this job; the SARIF is retained as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Gosec SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gosec-sarif
          path: gosec-results.sarif
          if-no-files-found: warn
          retention-days: 14

  govulncheck:
    name: Go Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # 与 scripts/release-config.json 的 goVersion 保持一致：扫描实际发布二进制所用的标准库
          go-version: '1.26.3'
          cache: false
      - name: Install govulncheck (pinned)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        shell: bash
        run: |
          set -o pipefail
          # 发现可达漏洞时退出码为 3，作业失败
          govulncheck -show verbose ./... 2>&1 | tee govulncheck-results.txt
      - name: Preserve govulncheck output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: govulncheck-results
          path: govulncheck-results.txt
          if-no-files-found: warn
          retention-days: 14

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['extension', 'scripts/release-tools']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run npm audit (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --audit-level=moderate

  trivy:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # pin of master @ 2026-11-20
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Trivy SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. CRITICAL/HIGH findings with an available fix fail this job; the SARIF is retained as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Trivy SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:1.187.0@sha256:0c8dfa7aa1ca8c50233ec9110e8cd88d139dedd603d56507493f74c6f4b3e062
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        # --error：有发现时非 0 退出；--severity ERROR：仅 ERROR 级规则参与阻断
        run: semgrep scan --sarif --output=semgrep-results.sarif --config=auto --error --severity ERROR
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Semgrep SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. ERROR-severity findings fail this job; the SARIF is retained as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Semgrep SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: go-licenses check ./...

  secrets-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
