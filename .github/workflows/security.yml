name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          post-processed-sarif-path: codeql-processed-sarif
          upload: never
      - name: Explain skipped GitHub Code Scanning upload
        if: always()
        run: |
          {
            echo "## GitHub Code Scanning upload: skipped"
            echo
            echo "CodeQL analysis runs locally in this workflow. Uploading SARIF to the GitHub Security tab is not available for this repository, so no Code Scanning upload was attempted. The SARIF artifact is retained below when produced. This is not a successful GitHub Security-tab scan."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: |
            codeql-results/
            codeql-processed-sarif/
          if-no-files-found: warn
          retention-days: 14

  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'
      
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Gosec SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. The scan still runs; its SARIF is retained as a workflow artifact when produced. This is not a successful Security-tab scan."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Gosec SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif
          path: gosec-results.sarif
          if-no-files-found: warn
          retention-days: 14

  nancy:
    name: Go Dependency Vulnerability Scan (nancy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Install nancy
        run: go install github.com/sonatype-nexus-community/nancy@latest
      
      - name: Run nancy
        shell: bash
        run: |
          set -o pipefail
          go list -json -deps ./... | nancy sleuth 2>&1 | tee nancy-results.txt
      - name: Preserve nancy scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nancy-results
          path: nancy-results.txt
          if-no-files-found: warn
          retention-days: 14

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['extension', 'scripts/release-tools']
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run npm audit (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --audit-level=moderate

  trivy:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Trivy SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. The scan still runs; its SARIF is retained as a workflow artifact when produced. This is not a successful Security-tab scan."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Trivy SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semgrep
        run: semgrep scan --sarif --output=semgrep-results.sarif --config=auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Explain skipped GitHub Security upload
        if: always()
        run: |
          {
            echo "## GitHub Security upload: skipped"
            echo
            echo "Semgrep SARIF is not uploaded to the GitHub Security tab because that feature is unavailable for this repository. The scan still runs; its SARIF is retained as a workflow artifact when produced. This is not a successful Security-tab scan."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Semgrep SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      
      - name: Check licenses
        run: go-licenses check ./...

  secrets-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
