name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
      - name: Go format check
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi
      - name: Go version policy check
        # Policy: go.mod = minimum source version (tested by reliability.yml minimum-go);
        # release-config goVersion = release toolchain (tested by reliability.yml test,
        # scanned by govulncheck). Every workflow go-version must be one of the two.
        shell: bash
        run: |
          set -euo pipefail
          mod=$(awk '$1=="go"{print $2; exit}' go.mod)
          cfg_mod=$(node -p "require('./scripts/release-config.json').goModVersion")
          cfg_rel=$(node -p "require('./scripts/release-config.json').goVersion")
          echo "go.mod=$mod goModVersion=$cfg_mod goVersion=$cfg_rel"
          if [ "$mod" != "$cfg_mod" ]; then
            echo "go.mod ($mod) != release-config goModVersion ($cfg_mod)"; exit 1
          fi
          bad=$(grep -rnE "go-version: *'[^']+'" .github/workflows | grep -vE "go-version: *'($mod|$cfg_rel)'" || true)
          if [ -n "$bad" ]; then
            echo "Workflow go-version must be $mod (minimum) or $cfg_rel (release):"; echo "$bad"; exit 1
          fi
      - name: Go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - name: Run staticcheck
        run: staticcheck ./...

  test:
    name: ${{ matrix.os }} / Go + extension
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Workspace indexing performance check
        shell: bash
        run: |
          set -euo pipefail
          output_file=$(mktemp)
          trap 'rm -f "$output_file"' EXIT
          go test -run '^$' -bench '^BenchmarkIndexWorkspace$' -benchtime=1x -benchmem ./internal/app | tee "$output_file"
          if ! grep -q '^PASS[[:space:]]*$' "$output_file" ||
             ! grep -Eq '^BenchmarkIndexWorkspace/[^[:space:]]+[[:space:]]+[1-9][0-9]*[[:space:]]+[0-9.]+[[:space:]]+ns/op' "$output_file"; then
            echo "Expected at least one completed workspace indexing benchmark."
            exit 1
          fi
      - name: Install extension dev dependencies
        working-directory: extension
        run: npm ci
      - name: Extension tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: extension
        run: npm.cmd test
      - name: Extension tests with coverage gate (Unix)
        if: runner.os != 'Windows'
        working-directory: extension
        run: npm run test:coverage
      - name: Extension syntax checks (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: extension
        run: npm.cmd run check
      - name: Extension syntax checks (Unix)
        if: runner.os != 'Windows'
        working-directory: extension
        run: npm run check
      - name: Offline preflight tests
        working-directory: extension
        run: node --test ../scripts/preflight.test.cjs
      - name: Generate coverage report (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html
      - name: Upload Go coverage to Codecov (Ubuntu)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          flags: go
          name: go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload extension coverage to Codecov (Ubuntu)
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./extension/coverage/lcov.info
          flags: extension
          name: extension
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifacts (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            extension/coverage/
          retention-days: 30

  vscode-integration:
    name: VS Code integration (real extension host)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build CLI into extension/bin
        run: go build -trimpath -buildvcs=false -o extension/bin/intentlens ./cmd/intentlens
      - name: Install extension dev dependencies
        working-directory: extension
        run: npm ci
      - name: Run VS Code integration test
        working-directory: extension
        env:
          VSCODE_TEST_VERSION: stable
        run: xvfb-run -a npm run test:integration
