name: Local VSIX candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-vsix-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Verify and package local VSIX
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Go verification
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extension verification
        working-directory: extension
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify candidate
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'intentlens-candidate')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'intentlens-candidate') -Filter '*.vsix')
          if ($candidates.Count -ne 1) { throw 'Expected exactly one candidate VSIX.' }
          ./scripts/test-release-integrity.ps1 -Vsix $candidates[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-local-vsix-candidate
          path: ${{ runner.temp }}/intentlens-candidate/*.vsix
          if-no-files-found: error
          retention-days: 7
