name: Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Enforce budgets (docs/production/performance-slo.md)
        env:
          INTENTLENS_PERF_GATE: '1'
        run: go test -run '^TestPerformanceBudget$' -count=1 -v ./internal/app

      - name: Record benchmarks
        run: |
          go test -run '^$' -bench . -benchtime=3x -benchmem ./internal/app ./internal/capture | tee benchmark.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30
