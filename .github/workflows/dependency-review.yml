name: Dependency Review

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: GitHub Dependency Review (skipped - unavailable)
    runs-on: ubuntu-latest
    steps:
      - name: Record unavailable feature (not a scan)
        run: |
          {
            echo "## GitHub Dependency Review: not executed"
            echo
            echo "The GitHub Dependency Review action/API is unavailable for this repository. This job records an explicit skip; it is not a passing dependency review and no GitHub Dependency Review scan was performed."
            echo
            echo "Independent free checks remain enabled in this workflow and Security Scanning, including go.mod tidiness, npm package checks, SBOM generation, Go dependency scanning, and npm audit."
          } >> "$GITHUB_STEP_SUMMARY"

  go-mod-tidy-check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain --untracked-files=all -- go.mod go.sum)" ]; then
            git status --short --untracked-files=all -- go.mod go.sum
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit changes."
            exit 1
          fi
          if ! git ls-files --error-unmatch -- go.sum >/dev/null 2>&1 && [ -e go.sum ]; then
            echo "go.sum was generated by 'go mod tidy' but is not tracked; review and commit required checksums."
            exit 1
          fi

  npm-outdated:
    name: Check Outdated npm Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['extension', 'scripts/release-tools']
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Check for outdated packages (${{ matrix.directory }})
        working-directory: ${{ matrix.directory }}
        run: |
          npm outdated || true
          echo "### Outdated packages in ${{ matrix.directory }}" >> $GITHUB_STEP_SUMMARY
          npm outdated --json | jq -r '.[] | "- \(.current) → \(.latest)"' >> $GITHUB_STEP_SUMMARY || echo "All up to date" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: Generate SBOM
        run: syft . -o spdx-json=sbom.spdx.json -o cyclonedx-json=sbom.cdx.json
      
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90
