version: "2"

run:
  modules-download-mode: readonly

linters:
  enable:
    - dupl
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      disabled-checks:
        - commentFormatting
        - whyNoLint
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104 # unchecked close errors are covered by errcheck
        - G304 # filesystem paths are constrained by the application state roots
    govet:
      enable-all: true
      enable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocritic
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - all
        path: extension/
      - linters:
          - staticcheck
        text: 'SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
      - '(^|/)\.git/'
      - '^\.github/'
      - '^\.work/'
      - '^vendor/'
      - '^node_modules/'
      - '^scripts/release-tools/node_modules/'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - '(^|/)\.git/'
      - '^\.github/'
      - '^\.work/'
      - '^vendor/'
      - '^node_modules/'
      - '^scripts/release-tools/node_modules/'

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true
