version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # 结构体字段排序建议，噪音大、与正确性无关
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G104 # Audit errors not checked (covered by errcheck)
        - G304 # File path injection (too many false positives)
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
        - whyNoLint
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - gocritic
      - path: extension/
        linters:
          - all
      - linters:
          - staticcheck
        text: 'SA1019:'
    paths:
      - \.git
      - \.github
      - \.work
      - vendor
      - node_modules
      - scripts/release-tools/node_modules
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  # 已启用（2026-11-23 落地时实测全量约 130 条历史问题：gocritic 50、gocyclo 45、
  # govet 26、errcheck 4、gosec 2、unused 2、staticcheck 1、prealloc 1）：
  # 先只阻断新引入的问题，历史问题逐步清理后去掉这行恢复全量阻断。
  new-from-merge-base: main

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - extension/
      - \.git
      - \.github
      - \.work
      - vendor
      - node_modules
      - scripts/release-tools/node_modules
      - third_party$
      - builtin$
      - examples$
