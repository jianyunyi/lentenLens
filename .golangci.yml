version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    gosec:
      excludes:
        - G104 # Audit errors not checked (covered by errcheck)
        - G304 # File path injection (too many false positives)
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
        - whyNoLint
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - gocritic
      - path: extension/
        linters:
          - all
      - linters:
          - staticcheck
        text: 'SA1019:'
    paths:
      - \.git
      - \.github
      - \.work
      - vendor
      - node_modules
      - scripts/release-tools/node_modules
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - extension/
      - \.git
      - \.github
      - \.work
      - vendor
      - node_modules
      - scripts/release-tools/node_modules
      - third_party$
      - builtin$
      - examples$
