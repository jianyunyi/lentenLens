codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 70%
        threshold: 2%
        base: auto
      go:
        flags: [go]
        target: 70%
        threshold: 2%
      extension:
        flags: [extension]
        target: auto
        threshold: 2%
    patch:
      default:
        target: 75%
        threshold: 5%

flags:
  go:
    paths:
      - cmd/
      - internal/
    carryforward: true
  extension:
    paths:
      - extension/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "**/*_test.go"
  - "extension/test/**"
  - "extension/src/*.backup"
  - "extension/src/*.phase1"
  - "scripts/**"
  - ".work/**"
  - "docs/**"
